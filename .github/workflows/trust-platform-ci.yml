name: Trust Platform CI

on:
  pull_request:
    paths:
      - "trust-platform/**"
      - ".github/workflows/trust-platform-ci.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "trust-platform/**"
      - ".github/workflows/trust-platform-ci.yml"

jobs:
  web:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trust-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trust-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
